<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Спасибо за отзыв!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; text-align: center; }
        .success-card { background: white; padding: 50px 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
        .icon { font-size: 64px; margin-bottom: 20px; }
        .title { color: #2c3e50; margin-bottom: 15px; }
        .text { color: #666; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="icon">✅</div>
        <h2 class="title">Спасибо за ваш отзыв!</h2>
        <p class="text">Ваше мнение очень важно для нас. Мы обязательно его учтем, чтобы стать еще лучше!</p>
    </div>
</body>
</html>
