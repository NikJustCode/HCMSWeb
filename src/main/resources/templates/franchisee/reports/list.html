<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Отчеты по обслуживанию')}">
</head>

<body>
    <header th:replace="~{fragments/cabinet-header :: header('Отчеты', '/franchisee/dashboard')}"></header>

    <main class="page-content">
        <section class="employees-section content-card">
            <div class="page-header-actions mb-4">
                <h1 class="section-title" style="margin: 0;">Отчеты сотрудников (через приложение)</h1>
            </div>

            <form method="get" action="/franchisee/reports" class="filter-form mb-4" style="display: flex; gap: 10px; align-items: center;">
                <label for="machineId" style="font-weight: 500;">Фильтр по автомату:</label>
                <select name="machineId" id="machineId" class="form-input" style="max-width: 300px;" onchange="this.form.submit()">
                    <option value="">Все автоматы</option>
                    <option th:each="machine : ${machines}" 
                            th:value="${machine.id}" 
                            th:text="${machine.name}"
                            th:selected="${machine.id == selectedMachineId}"></option>
                </select>
            </form>

            <div class="table-responsive" th:if="${not #lists.isEmpty(reports)}">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Объект</th>
                            <th>Персонал</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="report : ${reports}">
                            <td class="cell-bold">
                                <div class="employee-name-cell">
                                    <span class="contact-icon">📅</span>
                                    <span th:text="${#temporals.format(report.serviceDate, 'dd.MM.yyyy HH:mm')}"></span>
                                </div>
                            </td>
                            <td>
                                <div class="employee-contacts">
                                    <div class="contact-item">
                                        <span class="contact-icon">☕</span>
                                        <span class="cell-bold" th:text="${report.machine.name}"></span>
                                    </div>
                                    <div class="contact-item">
                                        <span class="contact-icon">📍</span>
                                        <span th:text="${report.machine.addressText}"></span>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div class="employee-contacts">
                                    <div class="contact-item">
                                        <span class="contact-icon">👤</span>
                                        <span class="cell-bold" th:text="${report.employee.fullName}"></span>
                                    </div>
                                    <div class="contact-item" th:if="${report.employee.phone}">
                                        <span class="contact-icon">📞</span>
                                        <span th:text="${report.employee.phone}"></span>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div class="table-actions-group">
                                    <a th:href="@{/franchisee/reports/{id}(id=${report.id})}"
                                        class="button button--small button--secondary">Подробнее</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${#lists.isEmpty(reports)}" class="empty-state">
                <p>Сотрудники пока не присылали отчетов об обслуживании.</p>
            </div>
        </section>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>

</html>
