<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Отзывы Автомата')}"></head>
<body>
    <header th:replace="~{fragments/cabinet-header :: header('Отзывы', '/franchisee/machines')}"></header>

    <main class="page-content">
        <section class="content-card">
            <div class="page-header-actions">
                <h1 class="section-title">Отзывы на автомат: <span th:text="${machine.name}"></span></h1>
                <a href="/franchisee/machines" class="button button--secondary">Назад</a>
            </div>

            <div th:if="${#lists.isEmpty(reviews)}" style="text-align: center; margin-top: 20px;">
                <p>На этот автомат пока нет отзывов.</p>
            </div>

            <div th:if="${!#lists.isEmpty(reviews)}">
                <div th:each="review : ${reviews}" style="border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 8px;">
                    <h3 style="margin-top: 0; color: #333;" th:text="${review.customerName}">Имя</h3>
                    <p style="color: #666; font-size: 0.9em; margin-bottom: 10px;">
                        <strong>Контакт:</strong> <span th:text="${review.contactNumber}">Номер</span> |
                        <strong>Дата:</strong> <span th:text="${#temporals.format(review.createdAt, 'dd.MM.yyyy HH:mm')}">Дата</span>
                    </p>
                    <p style="margin-bottom: 0;" th:text="${review.reviewText}">Текст отзыва</p>
                </div>
            </div>
        </section>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
